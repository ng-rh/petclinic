<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petclinic - MTC/OADP Migration Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
        }
        .tab-button {
            padding: 10px 20px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 16px;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        .tab-button:hover {
            color: #667eea;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .form-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #eee;
        }
        .form-section h3 {
            margin-bottom: 15px;
            color: #333;
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }
        .form-group input,
        .form-group select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #f5f5f5;
            font-weight: 600;
            color: #333;
        }
        tr:hover {
            background: #f9f9f9;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .error {
            color: #d32f2f;
            padding: 10px;
            background: #ffebee;
            border-radius: 4px;
            margin-top: 10px;
        }
        .success {
            color: #388e3c;
            padding: 10px;
            background: #e8f5e9;
            border-radius: 4px;
            margin-top: 10px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-card h3 {
            font-size: 32px;
            margin-bottom: 5px;
        }
        .stat-card p {
            font-size: 14px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐾 Petclinic Migration Demo</h1>
        <p class="subtitle">Spring Boot + PostgreSQL on OpenShift | MTC/OADP Ready</p>

        <div class="stats" id="stats"></div>

        <div class="tabs">
            <button class="tab-button active" onclick="showTab('owners')">Owners</button>
            <button class="tab-button" onclick="showTab('pets')">Pets</button>
            <button class="tab-button" onclick="showTab('vets')">Vets</button>
            <button class="tab-button" onclick="showTab('visits')">Visits</button>
        </div>

        <div id="owners" class="tab-content active">
            <h2>Pet Owners</h2>
            <div class="form-section">
                <h3>➕ Add New Owner</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" id="ownerFirstName" placeholder="First name">
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" id="ownerLastName" placeholder="Last name">
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" id="ownerAddress" placeholder="Address">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>City</label>
                        <input type="text" id="ownerCity" placeholder="City">
                    </div>
                    <div class="form-group">
                        <label>Telephone</label>
                        <input type="text" id="ownerTelephone" placeholder="Phone">
                    </div>
                </div>
                <button onclick="addOwner()">Add Owner</button>
                <div id="ownerMessage"></div>
            </div>
            <div id="owners-table" class="loading">Loading...</div>
        </div>

        <div id="pets" class="tab-content">
            <h2>Pets</h2>
            <div class="form-section">
                <h3>➕ Add New Pet</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="petName" placeholder="Pet name">
                    </div>
                    <div class="form-group">
                        <label>Birth Date</label>
                        <input type="date" id="petBirthDate">
                    </div>
                </div>
                <button onclick="addPet()">Add Pet</button>
                <div id="petMessage"></div>
            </div>
            <div id="pets-table" class="loading">Loading...</div>
        </div>

        <div id="vets" class="tab-content">
            <h2>Veterinarians</h2>
            <div class="form-section">
                <h3>➕ Add New Vet</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" id="vetFirstName" placeholder="First name">
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" id="vetLastName" placeholder="Last name">
                    </div>
                    <div class="form-group">
                        <label>Specialty</label>
                        <input type="text" id="vetSpecialty" placeholder="Specialty">
                    </div>
                </div>
                <button onclick="addVet()">Add Vet</button>
                <div id="vetMessage"></div>
            </div>
            <div id="vets-table" class="loading">Loading...</div>
        </div>

        <div id="visits" class="tab-content">
            <h2>Visits</h2>
            <div id="visits-table" class="loading">Loading...</div>
        </div>
    </div>

    <script>
        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });

            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'owners') loadOwners();
            else if (tabName === 'pets') loadPets();
            else if (tabName === 'vets') loadVets();
            else if (tabName === 'visits') loadVisits();
        }

        function addOwner() {
            const data = {
                firstName: document.getElementById('ownerFirstName').value,
                lastName: document.getElementById('ownerLastName').value,
                address: document.getElementById('ownerAddress').value,
                city: document.getElementById('ownerCity').value,
                telephone: document.getElementById('ownerTelephone').value
            };

            fetch('/owners', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(r => r.json())
            .then(result => {
                document.getElementById('ownerMessage').innerHTML = '<div class="success">✓ Owner added successfully!</div>';
                document.getElementById('ownerFirstName').value = '';
                document.getElementById('ownerLastName').value = '';
                document.getElementById('ownerAddress').value = '';
                document.getElementById('ownerCity').value = '';
                document.getElementById('ownerTelephone').value = '';
                setTimeout(() => loadOwners(), 500);
            })
            .catch(e => {
                document.getElementById('ownerMessage').innerHTML = '<div class="error">✗ Error: ' + e.message + '</div>';
            });
        }

        function addPet() {
            const data = {
                name: document.getElementById('petName').value,
                birthDate: document.getElementById('petBirthDate').value
            };

            fetch('/pets', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(r => r.json())
            .then(result => {
                document.getElementById('petMessage').innerHTML = '<div class="success">✓ Pet added successfully!</div>';
                document.getElementById('petName').value = '';
                document.getElementById('petBirthDate').value = '';
                setTimeout(() => loadPets(), 500);
            })
            .catch(e => {
                document.getElementById('petMessage').innerHTML = '<div class="error">✗ Error: ' + e.message + '</div>';
            });
        }

        function addVet() {
            const data = {
                firstName: document.getElementById('vetFirstName').value,
                lastName: document.getElementById('vetLastName').value,
                specialty: document.getElementById('vetSpecialty').value
            };

            fetch('/vets', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(r => r.json())
            .then(result => {
                document.getElementById('vetMessage').innerHTML = '<div class="success">✓ Vet added successfully!</div>';
                document.getElementById('vetFirstName').value = '';
                document.getElementById('vetLastName').value = '';
                document.getElementById('vetSpecialty').value = '';
                setTimeout(() => loadVets(), 500);
            })
            .catch(e => {
                document.getElementById('vetMessage').innerHTML = '<div class="error">✗ Error: ' + e.message + '</div>';
            });
        }

        function loadOwners() {
            fetch('/owners')
                .then(r => r.json())
                .then(data => {
                    let html = '<table><tr><th>ID</th><th>First Name</th><th>Last Name</th><th>Address</th><th>City</th><th>Phone</th></tr>';
                    data.forEach(owner => {
                        html += `<tr><td>${owner.id}</td><td>${owner.firstName}</td><td>${owner.lastName}</td><td>${owner.address}</td><td>${owner.city}</td><td>${owner.telephone}</td></tr>`;
                    });
                    html += '</table>';
                    document.getElementById('owners-table').innerHTML = html;
                })
                .catch(e => {
                    document.getElementById('owners-table').innerHTML = '<div class="error">Error loading data: ' + e.message + '</div>';
                });
        }

        function loadPets() {
            fetch('/pets')
                .then(r => r.json())
                .then(data => {
                    let html = '<table><tr><th>ID</th><th>Name</th><th>Birth Date</th></tr>';
                    data.forEach(pet => {
                        html += `<tr><td>${pet.id}</td><td>${pet.name}</td><td>${pet.birthDate}</td></tr>`;
                    });
                    html += '</table>';
                    document.getElementById('pets-table').innerHTML = html;
                })
                .catch(e => {
                    document.getElementById('pets-table').innerHTML = '<div class="error">Error loading data: ' + e.message + '</div>';
                });
        }

        function loadVets() {
            fetch('/vets')
                .then(r => r.json())
                .then(data => {
                    let html = '<table><tr><th>ID</th><th>First Name</th><th>Last Name</th><th>Specialty</th></tr>';
                    data.forEach(vet => {
                        html += `<tr><td>${vet.id}</td><td>${vet.firstName}</td><td>${vet.lastName}</td><td>${vet.specialty}</td></tr>`;
                    });
                    html += '</table>';
                    document.getElementById('vets-table').innerHTML = html;
                })
                .catch(e => {
                    document.getElementById('vets-table').innerHTML = '<div class="error">Error loading data: ' + e.message + '</div>';
                });
        }

        function loadVisits() {
            fetch('/visits')
                .then(r => r.json())
                .then(data => {
                    let html = '<table><tr><th>ID</th><th>Date</th><th>Description</th><th>Pet</th><th>Vet</th></tr>';
                    data.forEach(visit => {
                        html += `<tr><td>${visit.id}</td><td>${visit.visitDate}</td><td>${visit.description}</td><td>${visit.pet?.name || 'N/A'}</td><td>${visit.vet?.firstName} ${visit.vet?.lastName}</td></tr>`;
                    });
                    html += '</table>';
                    document.getElementById('visits-table').innerHTML = html;
                })
                .catch(e => {
                    document.getElementById('visits-table').innerHTML = '<div class="error">Error loading data: ' + e.message + '</div>';
                });
        }

        function loadStats() {
            Promise.all([
                fetch('/owners').then(r => r.json()),
                fetch('/pets').then(r => r.json()),
                fetch('/vets').then(r => r.json()),
                fetch('/visits').then(r => r.json())
            ]).then(([owners, pets, vets, visits]) => {
                document.getElementById('stats').innerHTML = `
                    <div class="stat-card"><h3>${owners.length}</h3><p>Pet Owners</p></div>
                    <div class="stat-card"><h3>${pets.length}</h3><p>Pets</p></div>
                    <div class="stat-card"><h3>${vets.length}</h3><p>Veterinarians</p></div>
                    <div class="stat-card"><h3>${visits.length}</h3><p>Visits</p></div>
                `;
            });
        }

        loadStats();
        loadOwners();
    </script>
</body>
</html>
