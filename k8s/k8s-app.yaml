apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: petclinic-demo
data:
  application.properties: |
    spring.application.name=petclinic-migration-demo
    server.port=8080
    server.servlet.context-path=/
    spring.datasource.url=jdbc:postgresql://postgres:5432/petclinic
    spring.datasource.username=postgres
    spring.datasource.password=petclinicpwd
    spring.datasource.driver-class-name=org.postgresql.Driver
    spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
    spring.jpa.hibernate.ddl-auto=validate
    spring.jpa.show-sql=false
    logging.level.root=INFO
    logging.level.org.acme.petclinic=DEBUG
    management.endpoints.web.exposure.include=health,info,metrics
    management.endpoint.health.show-details=always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic-app
  namespace: petclinic-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: petclinic-app
  template:
    metadata:
      labels:
        app: petclinic-app
    spec:
      serviceAccountName: petclinic-app
      securityContext:
        runAsNonRoot: true
      containers:
      - name: petclinic
        image: quay.io/nehgupta/petclinic:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: app-config
        configMap:
          name: app-config
---
apiVersion: v1
kind: Service
metadata:
  name: petclinic-service
  namespace: petclinic-demo
spec:
  selector:
    app: petclinic-app
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP
