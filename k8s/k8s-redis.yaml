apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: petclinic-demo
  labels:
    app: petclinic
    component: cache
data:
  redis.conf: |
    # Redis configuration for persistence
    port 6379
    bind 0.0.0.0
    databases 16
    
    # Persistence
    save 900 1
    save 300 10
    save 60 10000
    stop-writes-on-bgsave-error yes
    rdbcompression yes
    rdbchecksum yes
    dbfilename dump.rdb
    dir /data
    
    # Append-only file (for audit logs)
    appendonly yes
    appendfilename "appendonly.aof"
    appendfsync everysec
    
    # Max memory and eviction policy
    maxmemory 256mb
    maxmemory-policy allkeys-lru
    
    # Logging
    loglevel notice
    logfile ""
    
    # Timeout
    timeout 0
    tcp-keepalive 300

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: petclinic-demo
  labels:
    app: petclinic
    component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: petclinic
      component: cache
  template:
    metadata:
      labels:
        app: petclinic
        component: cache
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        
        command:
        - redis-server
        - /etc/redis/redis.conf
        
        ports:
        - name: redis
          containerPort: 6379
          protocol: TCP
        
        # Volume mounts
        volumeMounts:
        - name: redis-config
          mountPath: /etc/redis
          readOnly: true
        - name: redis-storage
          mountPath: /data
        
        # Resource requests and limits
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        
        # Liveness probe
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Readiness probe
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      
      # Termination grace period
      terminationGracePeriodSeconds: 30
      
      # Volumes
      volumes:
      - name: redis-config
        configMap:
          name: redis-config
          items:
          - key: redis.conf
            path: redis.conf
      - name: redis-storage
        persistentVolumeClaim:
          claimName: redis-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: petclinic-demo
  labels:
    app: petclinic
    component: cache
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: petclinic
    component: cache
